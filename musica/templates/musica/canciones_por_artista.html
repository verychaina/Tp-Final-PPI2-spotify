{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Canciones de {{ artista.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4 text-center">Canciones de {{ artista.name }}</h2>

    {% if canciones %}
        <div id="carruselSpotify" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                {% for cancion in canciones %}
                    <div class="carousel-item {% if forloop.first %}active{% endif %}">
                        <div class="d-flex justify-content-center">
                            <div class="card text-center" style="width: 24rem;">
                                <div class="card-body">
                                    <h5 class="card-title">{{ cancion.titulo }}</h5>
                                    <iframe src="https://open.spotify.com/embed/track/{{ cancion.id }}" width="100%" height="152" frameborder="0" allowtransparency="true" allow="encrypted-media"></iframe>
                                </div>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carruselSpotify" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carruselSpotify" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Siguiente</span>
            </button>
        </div>
    {% else %}
        <p>No hay canciones disponibles para este artista.</p>
    {% endif %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
