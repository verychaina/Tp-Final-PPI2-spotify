{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Spotify</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />

  <style>
body {
  margin: 0;
  font-family: 'Montserrat', sans-serif;
  background: linear-gradient(135deg, #191414 0%, #1DB954 100%);
  color: #fff;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.login-container {
  background: #121212;
  border-radius: 15px;
  padding: 40px 30px;
  box-shadow: 0 8px 30px rgba(29, 185, 84, 0.4);
  width: 100%;
  max-width: 400px;
  box-sizing: border-box;
}

h1 {
  margin-bottom: 30px;
  font-weight: 700;
  font-size: 2.2rem;
  text-align: center;
  color: #1DB954;
  letter-spacing: 1.2px;
}

form {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

input[type="text"],
input[type="password"] {
  background: #282828;
  border: none;
  border-radius: 8px;
  padding: 15px 20px;
  font-size: 1rem;
  color: #fff;
  outline: none;
  transition: background 0.3s ease;
  box-sizing: border-box;
}

input[type="text"]::placeholder,
input[type="password"]::placeholder {
  color: #b3b3b3;
}

input[type="text"]:focus,
input[type="password"]:focus {
  background: #1DB954;
  color: #121212;
  font-weight: 600;
}

button {
  background: #1DB954;
  border: none;
  border-radius: 50px;
  padding: 15px;
  color: #121212;
  font-weight: 700;
  font-size: 1.1rem;
  cursor: pointer;
  transition: background 0.3s ease;
  box-shadow: 0 8px 15px rgba(29, 185, 84, 0.5);
}

button:hover {
  background: #17a44d;
  box-shadow: 0 10px 20px rgba(23, 164, 77, 0.7);
}

.links {
  margin-top: 20px;
  text-align: center;
}

.links a {
  color: #1DB954;
  text-decoration: none;
  font-weight: 600;
  transition: color 0.3s ease;
}

.links a:hover {
  color: #17a44d;
  text-decoration: underline;
}

.logo-container {
  position: relative;
  text-align: center;
}

.logo-container img {
  max-width: 100px;
  height: auto;
  border-radius: 10px;
}

  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo-container">
      <img src="{% static 'images/logo_spotipy.png' %}" alt="Logo Spotipy" style="max-width: 120px; height: auto;">
    </div>
    <h1 id="page-title">Iniciar sesión</h1>
    <form method="post" class="login-form">
      {% csrf_token %}
      <input type="text" name="username" placeholder="Nombre de usuario" required />
      <input type="password" name="password" placeholder="Contraseña" required />
      <button type="submit">Entrar</button>
    </form>
    <div class="links">
      <a href="{% url 'password_reset' %}">¿Olvidaste tu contraseña?</a> | 
      <a href="{% url 'register' %}">Registrarse</a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      gsap.from("#page-title", {opacity: 0, y: -40, duration: 1, ease: "power2.out"});
      gsap.from(".login-form", {opacity: 0, y: 40, duration: 1, delay: 0.5, ease: "power2.out"});
      gsap.from(".links", {opacity: 0, y: 40, duration: 1, delay: 0.7, ease: "power2.out"});
    });
  </script>
  
</body>
</html>
