{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registro</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(to right, #1DB954, #191414);
      color: white;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    h1 {
      text-align: center;
      margin-top: 2rem;
      font-weight: 700;
    }

    .search-form {
      background-color: #121212;
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
      color: white;
    }

    .search-form input, .search-form select {
      background-color: #282828;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.5rem;
      margin-bottom: 1rem;
      width: 100%;
    }

    .search-form button {
      background-color: #1DB954;
      border: none;
      border-radius: 10px;
      padding: 0.75rem;
      color: white;
      font-weight: 700;
      width: 100%;
      transition: background-color 0.3s ease;
    }

    .search-form button:hover {
      background-color: #1aa34a;
    }

    a {
      color: #1DB954;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .logo-container {
     position: relative;
     text-align: center;
     bottom: 20px;
    }

    .logo-container img {
      max-width: 100px;
      height: auto;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <h1 id="page-title">Crear una cuenta</h1>

  <div class="container" style="max-width: 500px; margin-top: 2rem;">
    <div class="logo-container">
        <img src="{% static 'images/logo_spotipy.png' %}" alt="Logo Spotipy" style="max-width: 120px; height: auto;">
    </div>
    <form method="post" class="search-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Registrarse</button>
    </form>
    <p style="text-align: center; margin-top: 1rem;">
      ¿Ya tenés una cuenta? <a href="{% url 'login' %}">Iniciar sesión</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      gsap.from("#page-title", {opacity: 0, y: -30, duration: 1, ease: "power2.out"});
      gsap.from(".search-form", {opacity: 0, y: 20, duration: 1, delay: 0.5, ease: "power2.out"});
    });
  </script>
</body>
</html>
